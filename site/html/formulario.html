<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Cadastro e Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        
        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .tab:first-child {
            border-radius: 5px 0 0 0;
        }
        
        .tab:last-child {
            border-radius: 0 5px 0 0;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
        }
        
        .form-section {
            display: none;
        }
        
        .form-section.active {
            display: block;
        }
        
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 5px;
            font-size: 12px;
            color: #004085;
        }
        
        .info strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sistema de Cadastro e Login</h2>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab(event, 'cadastro')">Cadastro</button>
            <button class="tab" onclick="showTab(event, 'login')">Login</button>
        </div>
        
        <!-- Formulário de Cadastro -->
        <div id="cadastro" class="form-section active">
            <form id="formCadastro" onsubmit="handleCadastro(event)">
                <div class="form-group">
                    <label for="cadastroEmail">Email:</label>
                    <input type="email" id="cadastroEmail" placeholder="exemplo@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="cadastroSenha">Senha:</label>
                    <input type="password" id="cadastroSenha" placeholder="Mínimo 8 caracteres" required>
                </div>
                
                <div class="form-group">
                    <label for="cadastroCPF">CPF:</label>
                    <input maxlength="11" type="text" id="cadastroCPF" placeholder="123.456.789-00" required>
                </div>
                
                <button type="submit">Cadastrar</button>
            </form>
            
            <div class="info">
                <strong>Requisitos da senha:</strong>
                • Mínimo 8 caracteres<br>
                • 1 letra maiúscula<br>
                • 1 letra minúscula<br>
                • 1 número<br>
                • 1 caractere especial (@$!%*?&)
            </div>
        </div>
        
        <!-- Formulário de Login -->
        <div id="login" class="form-section">
            <form id="formLogin" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" placeholder="exemplo@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="loginSenha">Senha:</label>
                    <input type="password" id="loginSenha" placeholder="Sua senha" required>
                </div>
                
                <button type="submit">Entrar</button>
            </form>
        </div>
        
        <div id="message" class="message"></div>
        
    </div>
    
    <!-- Load module (served over http) which provides cadastrar/logar and utilities -->
    <script type="module" id="moduleScript" src="../script/script.js"></script>

    <!-- Controller: UI handlers (non-module) — uses window.cadastrar / window.logar exposed by module -->
    <script>
        // Track module load state and enable/disable form actions accordingly
        window._moduleLoaded = false;
        const moduleScript = document.getElementById('moduleScript');
        moduleScript.addEventListener('load', () => {
            window._moduleLoaded = true;
            // enable buttons
            document.querySelectorAll('button[type="submit"]').forEach(b => b.disabled = false);
            // hide any prior error message about scripts
            hideMessage();
            console.log('Module script loaded');
        });
        moduleScript.addEventListener('error', () => {
            window._moduleLoaded = false;
            showMessage('Não foi possível carregar scripts via http. Verifique o servidor (http) e o caminho.', false);
            console.error('Failed to load module script:', moduleScript.src);
        });

        // initially disable submit buttons until module loads
        document.querySelectorAll('button[type="submit"]').forEach(b => b.disabled = true);

        // small helper to ensure message element exists when called from load/error
        function ensureMessageEl() {
            if (!document.getElementById('message')) {
                const m = document.createElement('div');
                m.id = 'message';
                m.className = 'message';
                document.querySelector('.container').appendChild(m);
            }
        }

        ensureMessageEl();

        function showTab(e, tabName) {
            const tabs = document.querySelectorAll('.tab');
            const sections = document.querySelectorAll('.form-section');

            tabs.forEach(tab => tab.classList.remove('active'));
            sections.forEach(section => section.classList.remove('active'));

            if (e && e.currentTarget) e.currentTarget.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            hideMessage();
        }

        function showMessage(text, isSuccess) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = 'message ' + (isSuccess ? 'success' : 'error');
            messageEl.style.display = 'block';
        }

        function hideMessage() {
            const messageEl = document.getElementById('message');
            messageEl.style.display = 'none';
        }

        async function handleCadastro(event) {
            event.preventDefault();

            const email = document.getElementById('cadastroEmail').value;
            const senha = document.getElementById('cadastroSenha').value;
            const cpf = document.getElementById('cadastroCPF').value;

            if (!window._moduleLoaded || !window.cadastrar) {
                showMessage('Script não carregado. Sirva os arquivos via http e aguarde o carregamento.', false);
                return;
            }

            const resultado = await window.cadastrar(email, senha, cpf);

            if (resultado.success) {
                showMessage('Cadastro realizado com sucesso!', true);
                document.getElementById('formCadastro').reset();
            } else {
                showMessage('Erro: ' + resultado.message, false);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;

            if (!window._moduleLoaded || !window.logar) {
                showMessage('Script não carregado. Sirva os arquivos via http e aguarde o carregamento.', false);
                return;
            }

            const resultado = await window.logar(email, senha);

            if (resultado.success) {
                showMessage('Login realizado com sucesso! Bem-vindo, ' + resultado.data.email, true);
                document.getElementById('formLogin').reset();
            } else {
                showMessage('Erro: ' + resultado.message, false);
            }
        }

        window.showTab = showTab;
        window.handleCadastro = handleCadastro;
        window.handleLogin = handleLogin;
    </script>
</body>
</html>
